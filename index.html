<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">
    <h2 class="title">Now Playing</h2>

    <div class="album-art">
        🎵
    </div>

    <h3 class="song-name">Shape of You</h3>
    <p class="artist">Ed Sheeran</p>

    <input type="range" class="progress" value="40">

    <div class="time">
        <span>1:20</span>
        <span>3:50</span>
    </div>

    <div class="controls">
        <button>⏮</button>
        <button class="play">▶</button>
        <button>⏭</button>
    </div>
</div>

</body>
</html>
